[package]
name = "cctp"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/circle-iris"]

[dependencies]
alloy-chains = "0.2"
alloy-contract = "2.0"
alloy-network = "2.0"
alloy-primitives = "1.5"
alloy-provider = { version = "2.0", default-features = false, features = ["reqwest"] }
alloy-signer = "2.0"
alloy-sol-types = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
cctp-rs = "5.0.0"
circle-iris = { path = "crates/circle-iris" }
foundry-wallets = "0.1.0"
indicatif = "0.17"
progenitor-client = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "3"
solana-derivation-path = "3"
solana-keypair = { version = "3", features = ["seed-derivable"] }
solana-sdk = "3"
solana-seed-phrase = "3"
solana-transaction-status-client-types = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
